<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExNES</title>
    <link rel="stylesheet" href="static/styles/index.css?v=13">
</head>

<body>


    <div class="workspace">

        <div class="assembly-column">
            <div class="code-window">


            </div>
        </div>

        <div class="telemetry-column">

            <fieldset>
                <legend>CPU Status</legend>
                <div class="grid-row">
                    <div class="data-field"><label>A:</label><input type="text" value="0" readonly id="A"></div>
                    <div class="data-field"><label>X:</label><input type="text" value="0" readonly id="X"></div>
                    <div class="data-field"><label>Y:</label><input type="text" value="0" readonly id="Y"></div>
                    <div class="data-field"><label>PC:</label><input type="text" value="0" readonly id="PC"></div>
                </div>
                <div class="data-field" style="margin-bottom: 8px;">
                    <label style="width: 45px;">Cycle:</label>
                    <input type="text" value="0" readonly style="width: 100px;" id="Cycles">
                </div>
                <div style="font-weight: 500; margin-bottom: 4px; color: var(--text-muted);">Flags (P: 5)</div>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" id="Carry" checked disabled><label>Carry</label>
                    </div>
                    <div class="checkbox-item"><input type="checkbox" id="Zero" disabled><label>Zero</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="Interrupt" checked
                            disabled><label>Interrupt</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="Decimal" disabled><label>Decimal</label></div>
                    <div class="checkbox-item"><input type="checkbox" id="Overflow" disabled><label>Overflow</label>
                    </div>
                    <div class="checkbox-item"><input type="checkbox" id="Negative" disabled><label>Negative</label>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Execution Controls</legend>
                <button class="btn-primary " id="start-debugger">Start</button>
                <button class="btn-primary " id="start-execution" disabled>Begin</button>
                <button class="btn-primary pause" id="control-execution" disabled>Pause</button>


            </fieldset>
            <fieldset>
                <legend>Run</legend>
                <button class="btn-primary " id="run-cycle">cycle</button>
                <button class="btn-primary " id="run-frame">frame</button>
                <button class="btn-primary " id="run-30">30 frames</button>

              
                <div style="margin-top: 10px;">
                    <input type="number" id="custom-cycles-input" value="1" min="1" style="width: 60px; ">
                    <button class="btn-primary" id="run-custom-cycles">Run Cycles</button>
                </div>

            </fieldset>

            <fieldset>
                <legend>Snapshots</legend>
                <div id="snapshot-list" class="snapshot-container">

                </div>
            </fieldset>






        </div>
    </div>



</body>
<script src="static/scripts/index.js?v=0"></script>

</html>
