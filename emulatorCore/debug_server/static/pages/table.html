<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExNES Viewer</title>
    <link rel="stylesheet" href="static/styles/table.css">
</head>
<body>

    <fieldset style="border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; background-color: var(--panel-bg);">
    <legend style="font-weight: bold; padding: 0 5px; font-size: 11px;">PPU 4-Way Nametable Map Debugger</legend>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <canvas id="nametable-canvas" width="512" height="480" 
                style="background: #000; width: 100%; max-width: 512px; height: auto; aspect-ratio: 512/480; image-rendering: pixelated; border: 1px solid var(--border-color);">
        </canvas>
        <button id="fetch-nametable-btn" style="width: 100%;">Update Map View</button>
    </div>
</fieldset>

</body>
<script src="static/scripts/table.js"></script>
</html>
