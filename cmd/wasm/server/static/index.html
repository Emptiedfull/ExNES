<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExNES</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/nes.css/2.0.0/css/nes.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/dist/all.css">
     <link rel="icon" type="image/x-icon" href="/icons/nes.ico">
    <script src="/wasm_exec.js"></script>
</head>

<body>
    <div class="screen-items">
        <div class="main">

            <div class="main-title">
                <div><span style="color: rgb(70, 123, 215);">Ex</span><span style="color: #E60012;">NES</span></div>
                <div class="main-links">
                   <img src="./icons/github.svg" class="link-item" id="github"/>
                   
                   <img src="./icons/doc.svg" class="link-item" id="docs"/>
            
                     
                </div>
                <div class="main-title-controls">
                  
                    <div class="mode-rocker" id="rocker" data-mode="0">
                        <div class="mode-titles">
                            <span class="mode-title">rAF</span>
                            <span class="mode-title">Audio</span>
                        </div>
                        <div class="mode-paddle" id="paddle">
                            Audio
                        </div>
                    </div>
                </div>
            </div>
            <div class="tv">
                <div class="tv-body pixel-corners">
                    <div class="tv-corners--wrapper">
                        <canvas class="tv-corners tv-corners" id="screen" width="256" height="240"
                            style="image-rendering: pixelated; ;"></canvas>
                    </div>
                    <div class="control-bar control-corners">
                        <div class="knob-wrap">
                            <canvas id="sound" width="17" height="17"
                                style="width:86px;height:86px; image-rendering: pixelated;"></canvas>
                            <label>Sound</label>
                        </div>
                        <div class="knob-wrap">
                            <canvas id="speed" width="17" height="17"
                                style="width:86px;height:86px; image-rendering: pixelated;"></canvas>
                            <label>Speed</label>
                        </div>

                        <div class="grill">

                        </div>
                    </div>
                </div>
                <div class="legRow">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>

            <div class="nes">
                <div class="cartridge" id="cartridge">
                    NONTENDO <br> <span style="color: black;">entertainment system</span>
                </div>
                <div class="top-cap"></div>
                <div class="mid-line"></div> 
                <div class="slot" id="slot"></div>
               
                <div class="bottom-cap">
                    <div class="bottom-1">
                        <div class="buttons">
                            <button class="button startBtn highlight" id="start">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#E60012" stroke-width="4"
                                    stroke-linecap="square">
                                    <path d="M12 3v9" />
                                    <path d="M6.3 6.3a8 8 0 1 0 11.4 0" />
                                </svg>
                            </button>
                            <button class="button resetBtn" id="reset">
                                <svg viewBox="0 0 24 24" fill="none"  stroke="#5a3a1a" stroke-width="2.5"
                                    stroke-linecap="square">
                                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                                    <path d="M3 3v5h5" />
                                </svg>
                            </button>
                            <button class="button playbtn unpaused" id="pause">
                                <svg viewBox="0 0 24 24" fill="#5a3a1a" stroke="#5a3a1a" stroke-width="1.5"
                                    stroke-linecap="square" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="4" y="3" width="4" height="18" />
                                    <rect x="16" y="3" width="4" height="18" />
                                </svg>

                            </button>
                        </div>
                        <div class="led-grid">
                            <div class="pixel-led off" id="power">
                            </div>
                            <div class="pixel-led off" id="rom">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="strip" id="strip">
                    <!-- I DONT FUCKING KNOW WHY THIS HAS TO BE A SEPERATE ELEMETN I HATE CSS RULES -->
                    <div class="strip-background"> 

                    </div>
                    <div class="save-cap" id="rewind-cap">
                            
                        </div>
                    <div class="save-area" id="rewind-area">
                        
                        <div class="save-middle" id="rewind-slot">

                        </div>
                    </div>
                    <div class="controllers">
                        <div class="port">
                            <span class="controllerLabel">1</span>
                            <div class="controller controller-corners" id="port-1"></div>


                        </div>
                        <div class="port">
                            <span class="controllerLabel">2</span>
                            <div class="controller controller-corners" id="port-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="table">
            <div class="table-top"></div>
            <div class="table-legs">
                <div class="table-leg"></div>
                <div class="table-leg"></div>
            </div>

        </div>
    </div>

    <div class="rom-overlay" id="overlay" style="display: none;">
        <div class="nav-panel">
            <div class="nav-btn back" id="nav-back">
                <canvas id="canvas-back" width="224" height="224" style="image-rendering:pixelated"></canvas>
            </div>
            <div class="nav-btn next" id="nav-front">
                <canvas id="canvas-next" width="224" height="224" style="image-rendering:pixelated"></canvas>
            </div>
        </div>
        <div class="romCarousel">
            <div class="romItem side" id="left">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>
            </div>
            <div class="romItem active" id="middle">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>
            </div>
            <div class="romItem side" id="right">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>
            </div>
        </div>
    </div>
    <div class="control-container " id="joypad-cont">
        <div class="update-panel update-corners" id="update-panel">
            <div class="view-1" style="display: none;">
                <h1> Click a button on the joypad or keyboard...</h1>
            </div>
            <div class="view-2">
                <div class="update-text">
                    Press a key to rebind..
                </div>
                <div class="update-deco-line">

                </div>
                <div class="show-cont">
                    <span id="show-action">
                        <span id="show-text"></span>
                        <span class="show-key" id="key-display"></span>
                    </span>

                </div>

            </div>

        </div>
        <div class="Joypad Joypad-corners " id="joypad">
            <div class="Joypad-inner">
                <div class="movement-section">
                    <div class="dpad">
                        <div class="dpad-cross">
                            <div class="cross-vertical">
                                <div class="cross-vertical-line"></div>
                            </div>
                            <div class="cross-horizontal">
                                <div class="cross-horizontal-line"></div>
                            </div>
                        </div>
                        <div class="dpad-main">
                            <div class="main-vertical">
                                <div class="main-vertical-line">
                                    <button class="dpad-up joypad-button " id="dpad-up"></button>
                                    <button class="joypad-button" id="dpad-down"></button>
                                </div>
                            </div>
                            <div class="main-horizontal">
                                <div class="main-horizontal-line">
                                    <button class="joypad-button" id="dpad-left"></button>
                                    <button class="joypad-button" id="dpad-right"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-section">
                    <div class="decoration">
                        <button class="decobox" id="control-update">
                            Update Controls
                        </button>
                        <div class="decobox"></div>
                        <div class="decobox" id="control-label">
                            <span>
                                START
                            </span>
                            <span>
                                SELECT
                            </span>
                        </div>
                    </div>
                    <div class="control-buttons">
                        <div class="control-buttons-inner">
                            <button class="select control-button joypad-button" id="joypad-start">
                                <button class="start control-button joypad-button" id="joypad-select">
                        </div>
                    </div>
                </div>
                <div class="main-section">
                    <div class="main-buttons">
                        <div class="main-button-cont ">
                            <button class="joypad-button" id="joypad-A">A</button>
                        </div>
                        <div class="main-button-cont">
                            <button class="joypad-button" id="joypad-B">B</button>
                        </div>
                    </div>
                    <div class="main-text">
                        NONTENDO
                    </div>
                </div>


            </div>
        </div>
    </div>

    <div class="rewind-overlay" id="rewind-overlay" style="display: none;">
        <div class="rewind-container">
            <div class="tape-container">
                <div class="decorative-tape">

                </div>
                <div class="items-container" id="items-container">

                </div>
                <div class="decorative-tape">

                </div>


            </div>
        </div>

        <div class="rewind-controls">
            <span class="rewind-fullback rewind-start" id="rewind-start">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <g fill="currentColor">
                        <rect x="30" y="30" width="10" height="60" />
                        <rect x="80" y="30" width="10" height="10" />
                        <rect x="70" y="40" width="10" height="10" />
                        <rect x="60" y="50" width="10" height="10" />
                        <rect x="50" y="60" width="10" height="10" />
                        <rect x="60" y="70" width="10" height="10" />
                        <rect x="70" y="80" width="10" height="10" />
                        <rect x="80" y="90" width="10" height="10" />
                        <rect x="60" y="55" width="30" height="10" />
                        <rect x="60" y="65" width="30" height="10" />
                    </g>
                </svg>

            </span>
            <span class="rewind-back rewind-start" id="rewind-back">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <g fill="currentColor">
                        <rect x="70" y="30" width="10" height="10" />
                        <rect x="60" y="40" width="10" height="10" />
                        <rect x="50" y="50" width="10" height="10" />
                        <rect x="40" y="60" width="10" height="10" />
                        <rect x="50" y="70" width="10" height="10" />
                        <rect x="60" y="80" width="10" height="10" />
                        <rect x="70" y="90" width="10" height="10" />
                        <rect x="60" y="55" width="20" height="10" />
                        <rect x="60" y="65" width="20" height="10" />
                    </g>
                </svg>

            </span>
            <div class="rewind-bar">
                <div class="rewind-highlight" id="rewind-highlight">

                </div>
                <input type="range" class="rewind-miniscroll" id="rewind-timeline" min="0" max="100" value="35">
            </div>

            <span class="rewind-front rewind-end" id="rewind-next">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <g fill="currentColor">
                        <rect x="40" y="30" width="10" height="10" />
                        <rect x="50" y="40" width="10" height="10" />
                        <rect x="60" y="50" width="10" height="10" />
                        <rect x="70" y="60" width="10" height="10" />
                        <rect x="60" y="70" width="10" height="10" />
                        <rect x="50" y="80" width="10" height="10" />
                        <rect x="40" y="90" width="10" height="10" />
                        <rect x="40" y="55" width="20" height="10" />
                        <rect x="40" y="65" width="20" height="10" />
                    </g>
                </svg>

            </span>
            <span class="rewind-fullfront rewind-end" id="rewind-end">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <g fill="currentColor">
                        <rect x="80" y="30" width="10" height="60" />
                        <rect x="30" y="30" width="10" height="10" />
                        <rect x="40" y="40" width="10" height="10" />
                        <rect x="50" y="50" width="10" height="10" />
                        <rect x="60" y="60" width="10" height="10" />
                        <rect x="50" y="70" width="10" height="10" />
                        <rect x="40" y="80" width="10" height="10" />
                        <rect x="30" y="90" width="10" height="10" />
                        <rect x="30" y="55" width="30" height="10" />
                        <rect x="30" y="65" width="30" height="10" />
                    </g>
                </svg>

            </span>
        </div>

       

        <div class="review-cartridge" id="review-cart">
            <div class="review-cartridge-shadow"></div>
            <div class="review-cartridge-body">

                <div class="review-cartridge-header">
                    <span class="review-screw"></span>
                    <span class="review-cartridge-label">FRAME</span>
                    <span class="review-screw"></span>
                </div>

                <div class="review-screen-frame">
                   
                    <div class="review-screen-inset">
                        <canvas id="preview-img" ></canvas>
                    </div>
                </div>

                <div class="review-cartridge-header">
                    <span class="review-screw"></span>
                    <span class="review-cartridge-id">NO. 005</span>
                    <span class="review-screw"></span>
                </div>

                <div class="review-load-wrap">
                    <div class="review-load-shadow"></div>
                    <button class="review-load" id="review-load">LOAD</button>
                </div>

                <div class="review-pin-row">
                    <span class="review-pin"></span>
                    <span class="review-pin"></span>
                    <span class="review-pin"></span>
                    <span class="review-pin"></span>
                    <span class="review-pin"></span>
                </div>

            </div>
        </div>
    </div>
    <div class="guide-overlay guide-corners" style="display: none;">
        <div class="guide-top">
             <span>WELCOME TO EXNES</span>
            <svg class="guide-close" id="guide-close" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </div>
        <div class="guide-main" >
            <div class="guide-sidebar">
                <div class="guide-sidebar-title">
                    Guides
                </div>
                <div class="guide-items"  id="guideList" >
                
                </div>
            </div>
            <div class="markdown-body">

            </div>
        </div>


    </div>

        <div class="controller-cable controller-corners" id="cable-1"> </div>
        <div class="cable-wire" id="wire-1"></div>

        <div class="controller-cable controller-corners" id="cable-2"> </div>
        <div class="cable-wire" id="wire-2"></div>

        <div class="moodle-bar">
            

        </div>
</body>
<script src="/scripts/marked.min.js"></script>
<script src="/dist/nes.js" type="module"></script>

</html>
