<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NES D-pad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #D6D0C4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
  }

  /* Controller face plate region */
  .controller-face {
    background: #4A4845;
    border-radius: 6px;
    padding: 36px 40px;
    border: 3px solid #3B3835;
    box-shadow:
      inset 0 2px 0 #5a5855,
      inset 0 -2px 0 #2e2c2a;
  }

  /* D-pad cross */
  .dpad {
    position: relative;
    width: 120px;
    height: 120px;
  }

  .dpad-btn {
    position: absolute;
    background: #1E1D1B;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: background 80ms, transform 80ms;
    outline: none;
  }

  /* Arrow chevrons via clip-path */
  .dpad-btn::after {
    content: '';
    display: block;
    width: 0;
    height: 0;
  }

  /* Up */
  .dpad-up {
    top: 0; left: 40px;
    width: 40px; height: 40px;
    border-radius: 4px 4px 0 0;
    border-bottom: 1px solid #111;
  }
  .dpad-up::after {
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 10px solid #8C867C;
  }

  /* Down */
  .dpad-down {
    bottom: 0; left: 40px;
    width: 40px; height: 40px;
    border-radius: 0 0 4px 4px;
    border-top: 1px solid #111;
  }
  .dpad-down::after {
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid #8C867C;
  }

  /* Left */
  .dpad-left {
    left: 0; top: 40px;
    width: 40px; height: 40px;
    border-radius: 4px 0 0 4px;
    border-right: 1px solid #111;
  }
  .dpad-left::after {
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 10px solid #8C867C;
  }

  /* Right */
  .dpad-right {
    right: 0; top: 40px;
    width: 40px; height: 40px;
    border-radius: 0 4px 4px 0;
    border-left: 1px solid #111;
  }
  .dpad-right::after {
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 10px solid #8C867C;
  }

  /* Center piece */
  .dpad-center {
    position: absolute;
    top: 40px; left: 40px;
    width: 40px; height: 40px;
    background: #1E1D1B;
    z-index: 1;
  }

  /* Press states */
  .dpad-btn:active,
  .dpad-btn.pressed {
    background: #111;
    transform: scale(0.95);
  }
  .dpad-btn:active::after,
  .dpad-btn.pressed::after {
    opacity: 0.6;
  }

  /* Inset shadow on the dpad cross edges */
  .dpad-up    { box-shadow: inset 0 3px 0 #2e2d2b, inset 2px 0 0 #2e2d2b, inset -2px 0 0 #2e2d2b; }
  .dpad-down  { box-shadow: inset 0 -3px 0 #2e2d2b, inset 2px 0 0 #2e2d2b, inset -2px 0 0 #2e2d2b; }
  .dpad-left  { box-shadow: inset -3px 0 0 #2e2d2b, inset 0 2px 0 #2e2d2b, inset 0 -2px 0 #2e2d2b; }
  .dpad-right { box-shadow: inset 3px 0 0 #2e2d2b, inset 0 2px 0 #2e2d2b, inset 0 -2px 0 #2e2d2b; }

  /* Label below */
  .label {
    margin-top: 28px;
    color: #C8C3B8;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.55;
  }

  /* Pressed indicator */
  .indicator {
    margin-top: 10px;
    height: 18px;
    color: #C8C3B8;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
    opacity: 0;
    transition: opacity 120ms;
  }
  .indicator.show { opacity: 0.8; }
</style>
</head>
<body>

<div class="controller-face">
  <div class="dpad" role="group" aria-label="D-pad directional buttons">
    <button class="dpad-btn dpad-up"    aria-label="Up"    data-dir="UP"></button>
    <button class="dpad-btn dpad-left"  aria-label="Left"  data-dir="LEFT"></button>
    <div    class="dpad-center"                                             ></div>
    <button class="dpad-btn dpad-right" aria-label="Right" data-dir="RIGHT"></button>
    <button class="dpad-btn dpad-down"  aria-label="Down"  data-dir="DOWN"></button>
  </div>
  <div class="label">D-pad</div>
  <div class="indicator" id="indicator">&nbsp;</div>
</div>

<script>
  const indicator = document.getElementById('indicator');
  let hideTimer;

  function flash(dir) {
    indicator.textContent = dir;
    indicator.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => indicator.classList.remove('show'), 500);
  }

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;

    btn.addEventListener('mousedown', () => {
      btn.classList.add('pressed');
      flash(dir);
    });
    btn.addEventListener('mouseup',   () => btn.classList.remove('pressed'));
    btn.addEventListener('mouseleave',() => btn.classList.remove('pressed'));

    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      btn.classList.add('pressed');
      flash(dir);
    });
    btn.addEventListener('touchend', () => btn.classList.remove('pressed'));
  });

  document.addEventListener('keydown', e => {
    const map = { ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT' };
    if (map[e.key]) {
      e.preventDefault();
      const sel = `.dpad-${map[e.key].toLowerCase()}`;
      document.querySelector(sel)?.classList.add('pressed');
      flash(map[e.key]);
    }
  });
  document.addEventListener('keyup', e => {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
    if (map[e.key]) document.querySelector(`.dpad-${map[e.key]}`)?.classList.remove('pressed');
  });
</script>
</body>
</html>
