<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm build</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="static/styles/main.css?v=1">
    <link rel="stylesheet" href="static/styles/nes.css?v=60">
    <link rel="stylesheet" href="static/styles/table.css?v=12">
    <link rel="stylesheet" href="static/styles/overlay.css?v=22">
    <script src="static/wasm_exec.js?v=20"></script>
</head>

<body>
    <div class="main">
        <div class="tv">
            <div class="tv-body pixel-corners">
                <div class="tv-corners--wrapper">
                    <canvas class="tv-corners tv-corners" id="screen" width="256" height="240"
                        style="height: 432px; width: 460px;image-rendering: pixelated; ;"></canvas>
                </div>
                <div class="control-bar control-corners">
                    <div class="knob-wrap">
                        <canvas id="sound" width="17" height="17"
                            style="width:86px;height:86px; image-rendering: pixelated;"></canvas>
                        <label>Sound</label>
                    </div>
                    <div class="knob-wrap">
                        <canvas id="brightness" width="17" height="17"
                            style="width:86px;height:86px; image-rendering: pixelated;"></canvas>
                        <label>Bright</label>
                    </div>

                    <div class="grill">
                    </div>

                </div>
            </div>
            <div class="legRow">
                <div class="leg"></div>
                <div class="leg"></div>
            </div>
        </div>

        <div class="nes">
            <div class="cartridge" id="cartridge">
                NONTENDO <br> <span style="color: black;">entertainment system</span>
            </div>
            <div class="top-cap"></div>
            <div class="mid-line">
                <div class="slot" id="slot"></div>
            </div>
            <div class="bottom-cap">
                <div class="bottom-1">
                    <div class="buttons">
                        <button class="button startBtn" id="start">
                            POWER
                        </button>
                        <button class="button resetBtn">
                            RESET
                        </button>
                    </div>
                    <div class="led-grid">
                        <div class="pixel-led off" id="power">
                        </div>
                        <div class="pixel-led off" id="rom">
                        </div>
                    </div>
                </div>
            </div>
            <div class="strip" id="strip">
                <div class="controllers">
                    <div class="port">
                        <span class="controllerLabel">1</span>
                        <div class="controller controller-corners"></div>
                    </div>
                    <div class="port">
                        <span class="controllerLabel">2</span>
                        <div class="controller controller-corners"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="table">
        <div class="table-top"></div>
        <div class="table-legs">
            <div class="table-leg"></div>
            <div class="table-leg"></div>
        </div>

    </div>

    <div class="rom-overlay" id="overlay" style="display: none;">
        <div class="nav-panel">
            <div class="nav-btn back" onclick="move(-1); pushbtn('canvas-back')">
                <canvas id="canvas-back" width="224" height="224" style="image-rendering:pixelated"></canvas>
            </div>
            <div class="nav-btn next" onclick="move(1); pushbtn('canvas-next')">
                <canvas id="canvas-next" width="224" height="224" style="image-rendering:pixelated"></canvas>
            </div>
        </div>
        <div class="romCarousel">

            <div class="romItem side" id="left">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>
            </div>
            <div class="romItem active" id="middle">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>

            </div>
            <div class="romItem side" id="right">
                <span>Mario</span>
                <div class="romImg"><img></div>
                <div class="rom-top"></div>
                <div class="rom-bottom"></div>
                <div class="rom-grain"></div>
                <div class="rom-grain-offset"></div>
                <div class="rom-arrow"></div>
                <div class="rom-spine">MARIO BROS</div>
            </div>
        </div>

    </div>

</body>

<script src="static/knob.js"></script>
<script src="static/wasm.js?v=10"></script>
<script src="static/scripts/carousel.js?v=12"></script>


</html>
