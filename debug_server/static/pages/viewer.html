<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExNES Viewer</title>
    <link rel="stylesheet" href="static/styles/viewer.css">
</head>
<body>

    <fieldset style="border: 1px solid #ababab; border-radius: 4px; padding: 10px; background-color: #ffffff; margin-bottom: 10px;">
    <legend style="font-weight: bold; padding: 0 5px; font-size: 11px;">CHR-ROM Pattern Table Viewer</legend>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <canvas id="chr-canvas" width="128" height="256" 
                style="background: #000; width: 128px; height: 256px; image-rendering: pixelated; border: 1px solid #ababab;">
        </canvas>
        <button id="fetch-chr-btn" style="padding: 4px 10px; cursor: pointer; font-size: 11px;">Load Pattern Table</button>
    </div>
</fieldset>

</body>
<script src="static/scripts/viewer.js"></script>
</html>
