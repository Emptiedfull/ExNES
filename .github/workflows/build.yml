name: build 

on: 
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
        
      - name: depts
        run: | 
         sudo apt-get update
         sudo apt-get install -y --no-install-recommends \
         libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-gfx-dev \
         libgtk-3-dev

      - name: build 
        run: go build ./...

  macos:
    needs: check
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      
          - runner: macos-13     
    runs-on: ${{matrix.runner}}
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: "instal deps"
        run: brew install sdl2 sdl2_ttf sdl2_image sdl2_gfx dylibbundler
        
      - name: "dmg time"
        run: bash ./build/macos.sh

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/*.dmg
      
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: exnes-macos
          path: dist/*.dmg

  windows:
    needs: check 
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write 
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with: 
          msystem: MINGW64
          update: true 
          install: >-
              mingw-w64-x86_64-toolchain
              mingw-w64-x86_64-go
              mingw-w64-x86_64-SDL2
              mingw-w64-x86_64-SDL2_ttf
              mingw-w64-x86_64-SDL2_image
              mingw-w64-x86_64-SDL2_gfx
              zip

      - name: build 
        run: bash ./build/windows.sh

      - name: installer 
        shell: pwsh
        run: |
            choco install innosetup --no-progress -y 
            $v = "${{ github.event.release.tag_name}}" -replace '^v',''
            if (-not $v) { $v = "0.0.0" }
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v build\installer.iss

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: 
          files: dist/*.zip dist/*-setup.exe


      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: exnes-windows
          path: dist/*.zip dist/*-setup.exe
      
  appimage:
    needs: check
    if: github.event_name == 'release' || github.event_name == 'workflow-dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: build container
        run: docker build -t exnes-build -f build/Dockerfile .

      - name: build Image 
        run: docker run --rm -v "$PWD:/src" -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOCACHE=/tmp/go-build -e GOMODCACHE=/tmp/go-mod exnes-build ./build/AppImage.sh

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: 
          files: dist/*.AppImage

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: exnes-appImage
          path: dist/*.AppImage

  

